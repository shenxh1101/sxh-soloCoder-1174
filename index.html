<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你画我猜 - Draw and Guess</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="lobby" class="screen active">
      <div class="lobby-container">
        <h1>🎨 你画我猜</h1>
        <div class="name-input">
          <label>你的昵称：</label>
          <input type="text" id="playerName" placeholder="输入你的昵称" maxlength="12">
        </div>
        <div class="create-room">
          <h2>创建房间</h2>
          <div class="form-group">
            <label>题库类别：</label>
            <select id="category">
              <option value="animal">动物</option>
              <option value="job">职业</option>
              <option value="movie">电影</option>
            </select>
          </div>
          <div class="form-group">
            <label>回合数：</label>
            <select id="rounds">
              <option value="3">3 回合</option>
              <option value="5" selected>5 回合</option>
              <option value="8">8 回合</option>
              <option value="10">10 回合</option>
            </select>
          </div>
          <button id="createBtn">创建房间</button>
        </div>
        <div class="join-room">
          <h2>加入房间</h2>
          <div class="form-group">
            <label>房间码：</label>
            <input type="text" id="roomCode" placeholder="输入6位房间码" maxlength="6">
          </div>
          <button id="joinBtn">加入房间</button>
        </div>
      </div>
    </div>

    <div id="gameRoom" class="screen">
      <div class="header">
        <div class="room-info">
          <span class="room-code">房间: <strong id="displayRoomCode"></strong></span>
          <span class="round-info">回合: <strong id="displayRound"></strong>/<span id="displayTotalRounds"></span></span>
        </div>
        <div class="timer">
          <span id="timer">--:--</span>
        </div>
        <div class="word-display">
          <span id="currentWord">----</span>
        </div>
      </div>

      <div class="main-content">
        <div class="left-panel">
          <div class="scoreboard">
            <h3>🏆 积分榜</h3>
            <ul id="playerList"></ul>
          </div>
          <div class="word-area" id="wordArea">
            <h3>当前词汇</h3>
            <p id="drawerWord"></p>
            <button id="hintBtn" class="hint-btn" disabled>获取提示 (-5分)</button>
          </div>
        </div>

        <div class="center-panel">
          <div class="canvas-container">
            <canvas id="canvas"></canvas>
          </div>
          <div class="toolbar" id="toolbar">
            <div class="tool-group">
              <label>颜色：</label>
              <input type="color" id="colorPicker" value="#000000">
            </div>
            <div class="tool-group">
              <label>粗细：</label>
              <input type="range" id="brushSize" min="2" max="30" value="5">
              <span id="brushSizeValue">5</span>
            </div>
            <button id="eraserBtn">橡皮擦</button>
            <button id="clearBtn">清屏</button>
          </div>
        </div>

        <div class="right-panel">
          <div class="chat-box">
            <div id="chatMessages"></div>
            <div class="chat-input">
              <input type="text" id="chatInput" placeholder="输入猜测..." disabled>
              <button id="sendBtn" disabled>发送</button>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div id="waitingArea" class="waiting-area">
          <p>等待房主开始游戏... 当前 <span id="playerCount">1</span>/5 名玩家</p>
          <button id="startGameBtn" style="display: none;">开始游戏</button>
        </div>
        <div id="gameControls" class="game-controls">
          <button id="exportLogBtn">保存对局日志</button>
        </div>
      </div>
    </div>

    <div id="gameOverModal" class="modal">
      <div class="modal-content">
        <h2>游戏结束</h2>
        <div class="mvp" id="mvpDisplay"></div>
        <div class="final-scores" id="finalScores"></div>
        <div class="round-summary" id="roundSummary"></div>
        <button id="backToLobbyBtn">返回大厅</button>
      </div>
    </div>

    <div id="reconnectOverlay" class="reconnect-overlay" style="display: none;">
      <div class="reconnect-box">
        <h2>连接断开</h2>
        <p>正在尝试重新连接...</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
